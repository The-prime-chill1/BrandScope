<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071B33" />
    <title>BRANDSCOPE — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0,#173f68 0,transparent 34rem),#071b33;color:#fff;font-family:Manrope,Arial,sans-serif}.card{width:min(100%,520px);padding:36px;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(255,255,255,.07);box-shadow:0 30px 80px rgba(0,0,0,.28);text-align:center}.mark{width:62px;height:62px;margin:0 auto 22px;border-radius:18px;background:linear-gradient(135deg,#3b6ef5,#21c7d9);box-shadow:0 18px 40px rgba(33,199,217,.2)}h1{margin:0 0 10px;font:700 30px Sora,Arial,sans-serif}p{margin:0;color:#bfd0e2;line-height:1.7}button{margin-top:24px;padding:12px 20px;border:0;border-radius:12px;background:#fff;color:#071b33;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark"></div><h1>You’re currently offline</h1><p>Your connection appears unavailable. Reconnect and try again to continue discovering and managing brands.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
