<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="BRANDSCOPE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRANDSCOPE" />
    <title>BRANDSCOPE — Where Brands Get Discovered</title>
    <meta name="description" content="BRANDSCOPE is the global social network exclusively for businesses, startups, creators, and brands. Discover brands, follow updates, and build your business audience. Built and powered by CHILL TECH LTD." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#071B33" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BRANDSCOPE — Where Brands Get Discovered" />
    <meta property="og:description" content="The dedicated discovery network built exclusively for businesses, independent brands, and startups worldwide. Powered by CHILL TECH LTD." />
    <meta property="og:site_name" content="BRANDSCOPE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BRANDSCOPE — Where Brands Get Discovered" />
    <meta name="twitter:description" content="The dedicated discovery network built exclusively for businesses, independent brands, and startups worldwide. Powered by CHILL TECH LTD." />

    <!-- Google Fonts: Sora for headings, Manrope for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BRANDSCOPE",
        "url": "https://brandscope-eight.vercel.app/",
        "description": "Where Brands Get Discovered — Global Commercial Brand Discovery & Business Social Network",
        "publisher": {
          "@type": "Organization",
          "name": "BRANDSCOPE",
          "url": "https://brandscope-eight.vercel.app",
          "foundingLocation": "Nigeria"
        },
        "creator": {
          "@type": "Organization",
          "name": "CHILL TECH LTD",
          "url": "https://chilltechltd.com"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://brandscope-eight.vercel.app/discover?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.jsx?v=3"></script>
  </body>
</html>
